apiVersion: v1
kind: Service
metadata:
  name: artifactory
spec:
  selector:
    app: artifactory
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  - name: api
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifactory-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: artifactory
  template:
    metadata:
      labels:
        app: artifactory
    spec:
      containers:
      - name: artifactory
        image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.161.26
        env:
        - name: JF_SHARED_DATABASE_TYPE
          value: postgresql
        - name: JF_SHARED_DATABASE_DRIVER
          value: org.postgresql.Driver
        - name: JF_SHARED_DATABASE_URL
          value: jdbc:postgresql://postgres:5432/artifactory
        - name: JF_SHARED_DATABASE_USERNAME
          value: postgres
        - name: JF_SHARED_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: POSTGRES_PASSWORD
        - name: JF_SHARED_EXTRAJAVAOPTS
          value: -Xms512m -Xmx2g
        ports:
        - containerPort: 8082
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        startupProbe:
          tcpSocket:
            port: 8082
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 8082
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/opt/jfrog/artifactory
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: artifactory-data
      securityContext:
        fsGroup: 1030
