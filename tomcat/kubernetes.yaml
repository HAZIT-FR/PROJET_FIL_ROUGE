apiVersion: v1
kind: Service
metadata:
  name: tomcat
spec:
  selector:
    app: tomcat
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tomcat-apps
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      containers:
      - name: tomcat
        image: fil-rouge/tomcat:1.0
        env:
        - name: TOMCAT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: TOMCAT_PASSWORD
        - name: JAVA_OPTS
          value: -Xmx512m
        - name: DB_HOST
          value: mysql
        - name: DB_PORT
          value: '3306'
        - name: DB_NAME
          value: application
        - name: DB_USER
          value: application
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: MYSQL_PASSWORD
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: apps
          mountPath: /usr/local/tomcat/webapps
      volumes:
      - name: apps
        persistentVolumeClaim:
          claimName: tomcat-apps
      initContainers:
      - name: manager
        image: fil-rouge/tomcat:1.0
        command:
        - sh
        - -c
        - cp -a /usr/local/tomcat/webapps/manager /apps/
        volumeMounts:
        - name: apps
          mountPath: /apps
