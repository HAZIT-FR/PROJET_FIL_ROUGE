name: fil-rouge-tomcat
services:
  tomcat:
    restart: unless-stopped
    image: fil-rouge/tomcat:1.0
    build: .
    environment:
      TOMCAT_PASSWORD: ${TOMCAT_PASSWORD}
      JAVA_OPTS: -Xmx512m
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: application
      DB_USER: application
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
    - "8089:8080"
    volumes:
    - tomcat-apps:/usr/local/tomcat/webapps
volumes:
  tomcat-apps:
networks:
  default:
    name: fil-rouge
    external: true
