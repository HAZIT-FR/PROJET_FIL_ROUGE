apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fil-rouge
resources:
- namespace.yaml
- gitlab/kube/deployment.yaml
- jenkins/kube/deployment.yaml
- tomcat/kube/deployment.yaml
- mysql/kube/deployment.yaml
- postgres/kube/deployment.yaml
- artifactory/kube/deployment.yaml
- sonarqube/kube/deployment.yaml
secretGenerator:
- name: fil-rouge-env
  envs:
  - .env
configMapGenerator:
- name: jenkins-config
  files:
  - jenkins/compose/jenkins.yaml
- name: postgres-init
  files:
  - postgres/compose/initialiser.sql
