apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fil-rouge
resources:
- namespace.yaml
- gitlab/kubernetes.yaml
- jenkins/kubernetes.yaml
- tomcat/kubernetes.yaml
- mysql/kubernetes.yaml
- postgres/kubernetes.yaml
- artifactory/kubernetes.yaml
- sonarqube/kubernetes.yaml
secretGenerator:
- name: fil-rouge-env
  envs:
  - .env
configMapGenerator:
- name: jenkins-config
  files:
  - jenkins/jenkins.yaml
- name: postgres-init
  files:
  - postgres/initialiser.sql
