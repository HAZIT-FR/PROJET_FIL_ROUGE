jenkins:
  systemMessage: "Projet fil rouge"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  remotingSecurity:
    enabled: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: tomcat
              username: deployer
              password: "${TOMCAT_PASSWORD}"
          - usernamePassword:
              id: mysql
              username: application
              password: "${MYSQL_PASSWORD}"
