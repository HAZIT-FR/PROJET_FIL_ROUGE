# Doc : https://github.com/jenkinsci/configuration-as-code-plugin
jenkins:
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: tomcat
              username: admin
              password: "${TOMCAT_PASSWORD}"
          - usernamePassword:
              id: mysql
              username: application
              password: "${MYSQL_PASSWORD}"
