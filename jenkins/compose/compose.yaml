# Doc : https://www.jenkins.io/doc/book/installing/docker/
name: fil-rouge-jenkins
services:
  jenkins:
    restart: unless-stopped
    image: fil-rouge/jenkins:1.0
    build: .
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx1536m
      CASC_JENKINS_CONFIG: /etc/jenkins/jenkins.yaml
      JENKINS_PASSWORD: ${JENKINS_PASSWORD}
      TOMCAT_PASSWORD: ${TOMCAT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
    - "8080:8080"
    volumes:
    - jenkins-data:/var/jenkins_home
    - ./jenkins.yaml:/etc/jenkins/jenkins.yaml:ro
    - mysql-backups:/backups
volumes:
  jenkins-data:
  mysql-backups:
networks:
  default:
    name: fil-rouge
    external: true
