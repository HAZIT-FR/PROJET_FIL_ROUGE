apiVersion: v1
kind: Service
metadata:
  name: jenkins
spec:
  selector:
    app: jenkins
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-backups
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
      - name: jenkins
        image: fil-rouge/jenkins:1.0
        env:
        - name: JAVA_OPTS
          value: -Djenkins.install.runSetupWizard=false -Xmx1536m
        - name: CASC_JENKINS_CONFIG
          value: /etc/jenkins/jenkins.yaml
        - name: JENKINS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: JENKINS_PASSWORD
        - name: TOMCAT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: TOMCAT_PASSWORD
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: MYSQL_PASSWORD
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/jenkins_home
        - name: backups
          mountPath: /backups
        - name: configuration
          mountPath: /etc/jenkins
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: jenkins-data
      - name: backups
        persistentVolumeClaim:
          claimName: jenkins-backups
      - name: configuration
        configMap:
          name: jenkins-config
      securityContext:
        fsGroup: 1000
