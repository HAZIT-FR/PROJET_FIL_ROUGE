name: fil-rouge

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  gitlab:
    <<: *service
    image: gitlab/gitlab-ce:19.6.1-ce.0
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_PASSWORD:?Renseigner .env}
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_URL}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        prometheus_monitoring['enable'] = false
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
    ports:
      - "${HOST_IP:-127.0.0.1}:8088:80"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab

  jenkins:
    <<: *service
    image: ${JENKINS_IMAGE:-fil-rouge/jenkins:1.0}
    build: ./jenkins
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx1536m
      CASC_JENKINS_CONFIG: /etc/jenkins/jenkins.yaml
      JENKINS_PASSWORD: ${JENKINS_PASSWORD:?Renseigner .env}
      JENKINS_URL: ${JENKINS_URL}
      TOMCAT_PASSWORD: ${TOMCAT_PASSWORD:?Renseigner .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Renseigner .env}
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./jenkins/jenkins.yaml:/etc/jenkins/jenkins.yaml:ro
      - mysql-backups:/backups

  tomcat:
    <<: *service
    image: fil-rouge/tomcat:1.0
    build: ./tomcat
    environment:
      TOMCAT_PASSWORD: ${TOMCAT_PASSWORD:?Renseigner .env}
      JAVA_OPTS: -Xmx512m
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: application
      DB_USER: application
      DB_PASSWORD: ${MYSQL_PASSWORD:?Renseigner .env}
    ports:
      - "${HOST_IP:-127.0.0.1}:8089:8080"
    volumes:
      - tomcat-apps:/usr/local/tomcat/webapps
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    <<: *service
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Renseigner .env}
      MYSQL_DATABASE: application
      MYSQL_USER: application
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Renseigner .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 15s
      timeout: 5s
      retries: 20

  postgres:
    <<: *service
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initialiser.sql:/docker-entrypoint-initdb.d/initialiser.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 10s
      timeout: 5s
      retries: 20

  artifactory:
    <<: *service
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.161.26
    environment:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://postgres:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: postgres
      JF_SHARED_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner .env}
      JF_SHARED_EXTRAJAVAOPTS: -Xms512m -Xmx2g
    ports:
      - "${HOST_IP:-127.0.0.1}:8082:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile: {soft: 32000, hard: 32000}

  sonarqube:
    <<: *service
    image: sonarqube:26.11.0.134175-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner .env}
    ports:
      - "${HOST_IP:-127.0.0.1}:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192

volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
  jenkins-data:
  tomcat-apps:
  mysql-data:
  mysql-backups:
  postgres-data:
  artifactory-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
