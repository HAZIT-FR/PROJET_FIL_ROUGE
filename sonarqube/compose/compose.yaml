# Doc : https://docs.sonarsource.com/sonarqube-community-build/server-installation/from-docker-image/installation-overview
name: fil-rouge-sonarqube
services:
  sonarqube:
    restart: unless-stopped
    image: sonarqube:26.11.0.134175-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - "9000:9000"
    volumes:
    - sonarqube-data:/opt/sonarqube/data
    - sonarqube-extensions:/opt/sonarqube/extensions
    - sonarqube-logs:/opt/sonarqube/logs
    # Prérequis Linux : https://docs.sonarsource.com/sonarqube-community-build/server-installation/pre-installation/linux
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
networks:
  default:
    name: fil-rouge
    external: true
