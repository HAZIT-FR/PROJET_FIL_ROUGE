apiVersion: v1
kind: Service
metadata:
  name: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
  - name: http
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-extensions
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-logs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
      - name: sonarqube
        image: sonarqube:26.11.0.134175-community
        env:
        - name: SONAR_JDBC_URL
          value: jdbc:postgresql://postgres:5432/sonarqube
        - name: SONAR_JDBC_USERNAME
          value: postgres
        - name: SONAR_JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 3Gi
        startupProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /opt/sonarqube/data
        - name: extensions
          mountPath: /opt/sonarqube/extensions
        - name: logs
          mountPath: /opt/sonarqube/logs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sonarqube-data
      - name: extensions
        persistentVolumeClaim:
          claimName: sonarqube-extensions
      - name: logs
        persistentVolumeClaim:
          claimName: sonarqube-logs
      securityContext:
        fsGroup: 1000
