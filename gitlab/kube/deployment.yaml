# Doc : https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: v1
kind: Service
metadata:
  name: gitlab
spec:
  selector:
    app: gitlab
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:19.6.1-ce.0
        env:
        - name: GITLAB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fil-rouge-env
              key: GITLAB_PASSWORD
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://localhost:8088'
            nginx['listen_port'] = 80
            prometheus_monitoring['enable'] = false
            gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: config
          mountPath: /etc/gitlab
        - name: data
          mountPath: /var/opt/gitlab
        - name: logs
          mountPath: /var/log/gitlab
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: gitlab-config
      - name: data
        persistentVolumeClaim:
          claimName: gitlab-data
      - name: logs
        persistentVolumeClaim:
          claimName: gitlab-logs
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
