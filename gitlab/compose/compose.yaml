# Doc : https://docs.gitlab.com/install/docker/configuration/
name: fil-rouge-gitlab
services:
  gitlab:
    restart: unless-stopped
    image: gitlab/gitlab-ce:19.6.1-ce.0
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_PASSWORD}
      # Configuration officielle de l’image GitLab (URL, ports, options).
      # https://docs.gitlab.com/install/docker/configuration/#pre-configure-docker-container
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8088'
        nginx['listen_port'] = 80
        prometheus_monitoring['enable'] = false
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
    ports:
    - "8088:80"
    volumes:
    - gitlab-config:/etc/gitlab
    - gitlab-data:/var/opt/gitlab
    - gitlab-logs:/var/log/gitlab
volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
networks:
  default:
    name: fil-rouge
    external: true
