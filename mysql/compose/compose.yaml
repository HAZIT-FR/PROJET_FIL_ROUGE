name: fil-rouge-mysql
services:
  mysql:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Renseigner .env}
      MYSQL_DATABASE: application
      MYSQL_USER: application
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Renseigner .env}
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - --silent
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
networks:
  default:
    name: fil-rouge
    external: true
