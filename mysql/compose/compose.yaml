# Doc : https://hub.docker.com/_/mysql
name: fil-rouge-mysql
services:
  mysql:
    restart: unless-stopped
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: application
      MYSQL_USER: application
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - --silent
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
networks:
  default:
    name: fil-rouge
    external: true
