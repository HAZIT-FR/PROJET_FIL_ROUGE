name: fil-rouge-postgres
services:
  postgres:
    restart: unless-stopped
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./initialiser.sql:/docker-entrypoint-initdb.d/initialiser.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
networks:
  default:
    name: fil-rouge
    external: true
